<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        /* CALCULATOR */

        .calculator {
            width: 350px;
            background: #1f1f1f;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.5);
        }

        #display {
            width: 100%;
            height: 80px;
            border: none;
            outline: none;
            border-radius: 15px;
            background: #2d2d2d;
            color: white;
            font-size: 32px;
            text-align: right;
            padding: 15px;
            margin-bottom: 20px;
        }

        /* BUTTON GRID */

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 18px;
            font-size: 22px;
            cursor: pointer;
            transition: 0.2s;
            color: white;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }

        .number {
            background: #333333;
        }

        .operator {
            background: orange;
        }

        .special {
            background: #555555;
        }

        .equal {
            background: #00b894;
            grid-column: span 4;
        }

        /* HISTORY */

        .history {
            width: 280px;
            background: #1f1f1f;
            border-radius: 25px;
            padding: 20px;
            color: white;
            max-height: 600px;
            overflow-y: auto;
        }

        .history h2 {
            margin-bottom: 15px;
            text-align: center;
        }

        .history-item {
            background: #2d2d2d;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            word-wrap: break-word;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            .container {
                flex-direction: column;
                align-items: center;
            }

            .calculator,
            .history {
                width: 100%;
                max-width: 350px;
            }

        }

    </style>
</head>

<body>

<div class="container">

    <!-- CALCULATOR -->

    <div class="calculator">

        <input type="text" id="display" readonly>

        <div class="buttons">

            <button class="special" onclick="clearDisplay()">C</button>
            <button class="special" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button class="number" onclick="appendValue('7')">7</button>
            <button class="number" onclick="appendValue('8')">8</button>
            <button class="number" onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button class="number" onclick="appendValue('4')">4</button>
            <button class="number" onclick="appendValue('5')">5</button>
            <button class="number" onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button class="number" onclick="appendValue('1')">1</button>
            <button class="number" onclick="appendValue('2')">2</button>
            <button class="number" onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button class="number" onclick="appendValue('0')">0</button>
            <button class="number" onclick="appendValue('.')">.</button>
            <button class="number" onclick="appendValue('(')">(</button>
            <button class="number" onclick="appendValue(')')">)</button>

            <button class="equal" onclick="calculate()">=</button>

        </div>

    </div>

    <!-- HISTORY -->

    <div class="history">

        <h2>Calculation History</h2>

        <div id="historyList"></div>

    </div>

</div>

<script>

    let display = document.getElementById("display");
    let historyList = document.getElementById("historyList");

    // LOAD SAVED HISTORY

    window.onload = function () {

        let savedHistory = localStorage.getItem("calculatorHistory");

        if (savedHistory) {

            historyList.innerHTML = savedHistory;

        }

    };

    // APPEND VALUES

    function appendValue(value) {

        display.value += value;

    }

    // CLEAR DISPLAY

    function clearDisplay() {

        display.value = "";

    }

    // DELETE LAST CHARACTER

    function deleteLast() {

        display.value = display.value.slice(0, -1);

    }

    // CALCULATE

    function calculate() {

        try {

            let expression = display.value;

            let result = eval(expression);

            let historyItem =
                `<div class="history-item">
                    ${expression} = ${result}
                </div>`;

            historyList.innerHTML =
                historyItem + historyList.innerHTML;

            // SAVE HISTORY

            localStorage.setItem(
                "calculatorHistory",
                historyList.innerHTML
            );

            display.value = result;

        }

        catch {

            display.value = "Error";

        }

    }

</script>

</body>

</html>
